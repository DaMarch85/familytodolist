<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Task Tracker</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-soft: #eef2ff;
        --green-soft: #ecfdf5;
        --amber-soft: #fff7ed;
        --border: #e5e7eb;
        --danger: #dc2626;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 220px);
        color: var(--text);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 18px 60px;
      }

      .hero,
      .panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 20px;
        margin-bottom: 18px;
      }

      .panel {
        padding: 20px;
        margin-bottom: 18px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-title {
        margin: 0;
        font-size: 1.2rem;
      }

      .count-badge,
      .mini-badge {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 0;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .task-form {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(140px, 0.7fr) minmax(110px, 0.4fr) auto;
        gap: 12px;
        align-items: stretch;
      }

      input[type="text"],
      select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        background: white;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        border: 0;
        border-radius: 0;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        min-width: 120px;
      }

      .secondary-btn {
        background: #f3f4f6;
        color: var(--text);
      }

      .danger-btn {
        background: #fee2e2;
        color: var(--danger);
      }

      .undo-btn {
        background: #dcfce7;
        color: #166534;
        min-width: 28px;
      }

      .task-list,
      .leaderboard-list {
        display: grid;
        gap: 12px;
      }

      .leaderboard-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .leader-card {
        border: 1px solid var(--border);
        background: white;
        padding: 14px;
      }

      .leader-name {
        font-weight: 800;
        font-size: 1rem;
        margin-bottom: 6px;
      }

      .leader-points {
        font-size: 1.2rem;
        font-weight: 900;
      }

      .leader-meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 6px;
      }

      .task-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px;
        background: #fff;
      }

      .done-item {
        background: var(--green-soft);
      }

      .check-btn {
        width: 22px;
        height: 22px;
        border-radius: 0;
        border: 2px solid var(--primary);
        background: white;
        padding: 0;
        min-width: 22px;
      }

      .task-text {
        min-width: 0;
      }

      .task-main {
        font-size: 1rem;
        word-break: break-word;
      }

      .task-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .chip {
        padding: 5px 8px;
        font-size: 0.78rem;
        font-weight: 700;
        border: 1px solid var(--border);
      }

      .chip.person {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .chip.points {
        background: var(--amber-soft);
        color: #b45309;
      }

      .task-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .task-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .celebration.show {
        opacity: 1;
        visibility: visible;
      }

      .celebration-inner {
        min-width: 100vw;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 900;
        line-height: 1.05;
        color: white;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
        animation: celebrationFlash 0.9s ease-in-out infinite alternate;
      }

      @keyframes celebrationFlash {
        0% {
          background: linear-gradient(135deg, #5b6ee1, #7c8fe8);
          opacity: 0.96;
        }
        50% {
          background: linear-gradient(135deg, #6bb7c8, #8fd0dc);
          opacity: 0.92;
        }
        100% {
          background: linear-gradient(135deg, #8a7fe0, #a7a1ea);
          opacity: 0.96;
        }
      }

      .empty-state {
        border: 1px dashed var(--border);
        border-radius: 0;
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .status-line {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 820px) {
        .task-form {
          grid-template-columns: 1fr 1fr;
        }

        .leaderboard-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .task-form {
          grid-template-columns: 1fr;
        }

        .task-item {
          grid-template-columns: auto 1fr;
        }

        .task-actions {
          grid-column: 1 / -1;
          justify-content: flex-start;
          margin-left: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="celebration" class="celebration" aria-live="polite">
        <div class="celebration-inner" id="celebrationText"></div>
      </div>

      <section class="hero">
        <form id="taskForm" class="task-form">
          <input
            id="taskInput"
            type="text"
            placeholder="Add a task, for example: Tidy playroom"
            maxlength="140"
            required
          />
          <select id="assigneeInput">
            <option value="">Who is it for?</option>
            <option>Douglas</option>
            <option>Wife</option>
            <option>Child 1</option>
            <option>Child 2</option>
            <option>Everyone</option>
          </select>
          <select id="pointsInput">
            <option value="1">1 point</option>
            <option value="2">2 points</option>
            <option value="3">3 points</option>
            <option value="5" selected>5 points</option>
            <option value="8">8 points</option>
            <option value="10">10 points</option>
          </select>
          <button type="submit" class="primary-btn">Add task</button>
        </form>
        <div id="statusLine" class="status-line">Connecting…</div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Leaderboard</h2>
          <div class="mini-badge" id="leaderboardSummary">0 points awarded</div>
        </div>
        <div id="leaderboard" class="leaderboard-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Outstanding tasks</h2>
          <div class="count-badge" id="todoCount">0</div>
        </div>
        <div id="todoList" class="task-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Done list</h2>
          <div class="count-badge" id="doneCount">0</div>
        </div>
        <div id="doneList" class="task-list"></div>
      </section>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://vsaqwqmrisyehofezolp.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_B5awAvzLtHLhk-2Lyf_CoQ_Y8R_ZXHo";
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const celebrationMessages = [
        "Well done! 🌟",
        "Congratulations, task champion! 🎉",
        "You're a superstar! ⭐",
        "Boom. Another one done! 💥",
        "Amazing work, family hero! 🦸",
        "High five! 🙌",
        "Gold star energy! 🌠",
        "That was brilliant! 🥳",
        "You smashed it! 🚀",
        "Super teamwork! 🤝",
        "Victory unlocked! 🏆",
        "Nice one! Keep going! 😄",
        "Task complete like a legend! 👑",
        "Outstanding effort! 🌈",
        "That deserves a happy dance! 💃",
        "Look at you getting things done! 😎",
        "Top job! 🍀",
        "Mission accomplished! ✅",
        "Household hero mode activated! ⚡",
        "Fantastic work, rock star! 🎸",
        "Levelling up! 🚀",
        "Huzzah! 🎊"
      ];

      const taskForm = document.getElementById("taskForm");
      const taskInput = document.getElementById("taskInput");
      const assigneeInput = document.getElementById("assigneeInput");
      const pointsInput = document.getElementById("pointsInput");
      const todoList = document.getElementById("todoList");
      const doneList = document.getElementById("doneList");
      const todoCount = document.getElementById("todoCount");
      const doneCount = document.getElementById("doneCount");
      const leaderboard = document.getElementById("leaderboard");
      const leaderboardSummary = document.getElementById("leaderboardSummary");
      const celebration = document.getElementById("celebration");
      const celebrationText = document.getElementById("celebrationText");
      const statusLine = document.getElementById("statusLine");

      let tasks = [];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatUpdatedAt(iso) {
        const date = new Date(iso);
        return `Last updated: ${date.toLocaleString([], {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit"
        })}`;
      }

      function getTaskPoints(task) {
        const value = Number(task.points ?? 1);
        return Number.isFinite(value) && value > 0 ? value : 1;
      }

      function renderLeaderboard() {
        const scoreMap = new Map();

        for (const task of tasks) {
          if (!task.is_done) continue;
          const person = task.assignee?.trim() || "Unassigned";
          const existing = scoreMap.get(person) || { points: 0, completed: 0 };
          existing.points += getTaskPoints(task);
          existing.completed += 1;
          scoreMap.set(person, existing);
        }

        const rows = Array.from(scoreMap.entries())
          .map(([name, stats]) => ({ name, ...stats }))
          .sort((a, b) => b.points - a.points || b.completed - a.completed || a.name.localeCompare(b.name));

        const totalPoints = rows.reduce((sum, row) => sum + row.points, 0);
        leaderboardSummary.textContent = `${totalPoints} point${totalPoints === 1 ? "" : "s"} awarded`;

        leaderboard.innerHTML = rows.length
          ? rows
              .map(
                (row, index) => `
                  <div class="leader-card">
                    <div class="leader-name">${index + 1}. ${escapeHtml(row.name)}</div>
                    <div class="leader-points">${row.points} pts</div>
                    <div class="leader-meta">${row.completed} task${row.completed === 1 ? "" : "s"} completed</div>
                  </div>
                `
              )
              .join("")
          : '<div class="empty-state">No points yet. First completed task wins the opening lead.</div>';
      }

      function renderTasks(target, rows, emptyText, isDone) {
        target.innerHTML = rows.length
          ? rows
              .map(
                (task) => `
              <div class="task-item ${isDone ? "done-item" : ""}" data-id="${task.id}">
                <button type="button" class="${isDone ? "undo-btn" : "check-btn"}" data-action="${isDone ? "undo" : "complete"}" title="${isDone ? "Move back to outstanding" : "Mark as done"}">${isDone ? "↺" : ""}</button>
                <div class="task-text">
                  <div class="task-main">${escapeHtml(task.title)}</div>
                  <div class="task-badges">
                    ${task.assignee ? `<span class="chip person">${escapeHtml(task.assignee)}</span>` : ""}
                    <span class="chip points">${getTaskPoints(task)} pt${getTaskPoints(task) === 1 ? "" : "s"}</span>
                  </div>
                  <div class="task-meta">${formatUpdatedAt(task.updated_at)}</div>
                </div>
                <div class="task-actions">
                  <button type="button" class="secondary-btn" data-action="edit">Edit</button>
                  <button type="button" class="danger-btn" data-action="delete">Delete</button>
                </div>
              </div>
            `
              )
              .join("")
          : `<div class="empty-state">${emptyText}</div>`;
      }

      function render() {
        const todos = tasks.filter((task) => !task.is_done);
        const done = tasks.filter((task) => task.is_done);

        todoCount.textContent = `${todos.length} task${todos.length === 1 ? "" : "s"}`;
        doneCount.textContent = `${done.length} done`;

        renderTasks(todoList, todos, "No outstanding tasks.", false);
        renderTasks(doneList, done, "Nothing completed yet.", true);
        renderLeaderboard();
      }

      async function loadTasks() {
        statusLine.textContent = "Loading tasks…";

        const { data, error } = await supabase
          .from("tasks")
          .select("*")
          .order("is_done", { ascending: true })
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: true });

        if (error) {
          console.error("loadTasks error", error);
          statusLine.textContent = `Could not load tasks: ${error.message}`;
          return false;
        }

        tasks = data ?? [];
        render();
        statusLine.textContent = "Connected.";
        return true;
      }

      async function addTask(title, assignee, points) {
        const sortOrder = tasks.reduce((max, t) => Math.max(max, Number(t.sort_order) || 0), 0) + 1;

        const { error } = await supabase.from("tasks").insert({
          title,
          assignee: assignee || null,
          points,
          is_done: false,
          sort_order: sortOrder
        });

        if (error) {
          console.error("addTask error", error);
          alert(`Could not add task: ${error.message}`);
          statusLine.textContent = `Add failed: ${error.message}`;
          return;
        }

        taskInput.value = "";
        assigneeInput.value = "";
        pointsInput.value = "5";
        taskInput.blur();
        await loadTasks();
      }

      async function updateTask(id, changes) {
        const { error } = await supabase.from("tasks").update(changes).eq("id", id);

        if (error) {
          console.error("updateTask error", error);
          alert(`Could not update task: ${error.message}`);
          statusLine.textContent = `Update failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      async function deleteTask(id) {
        const { error } = await supabase.from("tasks").delete().eq("id", id);

        if (error) {
          console.error("deleteTask error", error);
          alert(`Could not delete task: ${error.message}`);
          statusLine.textContent = `Delete failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      function showCelebration(task) {
        const message = celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
        const who = task.assignee?.trim() ? `${task.assignee} ` : "";
        const points = getTaskPoints(task);
        celebrationText.innerHTML = `${escapeHtml(message)}<br /><span style="font-size:0.55em; font-weight:800;">${escapeHtml(who)}+${points} point${points === 1 ? "" : "s"}</span>`;
        celebration.classList.add("show");

        clearTimeout(showCelebration.hideTimer);
        showCelebration.hideTimer = setTimeout(() => {
          celebration.classList.remove("show");
        }, 1800);
      }

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        const assignee = assigneeInput.value.trim();
        const points = Number(pointsInput.value) || 1;
        await addTask(title, assignee, points);
      });

      document.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const action = target.dataset.action;
        if (!action) return;

        const taskElement = target.closest("[data-id]");
        if (!taskElement) return;

        const id = taskElement.getAttribute("data-id");
        const task = tasks.find((item) => item.id === id);
        if (!task) return;

        if (action === "complete") {
          const ok = await updateTask(id, { is_done: true });
          if (ok) showCelebration(task);
          return;
        }

        if (action === "undo") {
          await updateTask(id, { is_done: false });
          return;
        }

        if (action === "edit") {
          const title = window.prompt("Edit task title:", task.title);
          if (title === null) return;
          const trimmedTitle = title.trim();
          if (!trimmedTitle) return;

          const assignee = window.prompt("Who is this for? Leave blank for none:", task.assignee || "");
          if (assignee === null) return;

          const points = window.prompt("How many points is it worth?", String(getTaskPoints(task)));
          if (points === null) return;
          const parsedPoints = Math.max(1, Number(points) || 1);

          await updateTask(id, {
            title: trimmedTitle,
            assignee: assignee.trim() || null,
            points: parsedPoints
          });
          return;
        }

        if (action === "delete") {
          const confirmed = window.confirm(`Delete this task?\n\n${task.title}`);
          if (confirmed) await deleteTask(id);
        }
      });

      supabase
        .channel("tasks-realtime")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "tasks" },
          async () => {
            await loadTasks();
          }
        )
        .subscribe();

      await loadTasks();
    </script>
  </body>
</html>
