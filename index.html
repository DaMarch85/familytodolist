<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Task Tracker</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-soft: #eef2ff;
        --green-soft: #ecfdf5;
        --border: #e5e7eb;
        --danger: #dc2626;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 220px);
        color: var(--text);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 18px 60px;
      }

      .hero,
      .panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 20px;
        margin-bottom: 18px;
      }

      .panel {
        padding: 20px;
        margin-bottom: 18px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-title {
        margin: 0;
        font-size: 1.2rem;
      }

      .count-badge,
      .mini-badge {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 0;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .task-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: stretch;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        background: white;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        border: 0;
        border-radius: 0;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        min-width: 120px;
      }

      .secondary-btn {
        background: #f3f4f6;
        color: var(--text);
      }

      .danger-btn {
        background: #fee2e2;
        color: var(--danger);
      }

      .woman-btn {
        background: #fdf2f8;
        color: #be185d;
        border: 1px solid #fbcfe8;
        min-width: 110px;
      }

      .man-btn {
        background: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
        min-width: 110px;
      }

      .undo-btn {
        background: #dcfce7;
        color: #166534;
      }

      .task-list,
      .score-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .score-card {
        border: 1px solid var(--border);
        background: white;
        padding: 16px;
      }

      .score-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      .score-value,
      .score-name {
        font-size: 2rem;
        font-weight: 900;
        line-height: 1;
      }

      .score-subtext {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .task-item {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px;
        background: #fff;
      }

      .done-item {
        background: var(--green-soft);
      }

      .done-by {
        margin-top: 8px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .done-by.woman {
        color: #be185d;
      }

      .done-by.man {
        color: #1d4ed8;
      }

      .task-text {
        min-width: 0;
        text-align: center;
      }

      .task-main {
        font-size: 1.15rem;
        word-break: break-word;
        text-align: center;
      }

      .task-meta {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .task-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 10px;
      }

      .task-links {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        justify-content: center;
      }

      .link-btn {
        background: transparent;
        color: #111827;
        border: 0;
        padding: 0;
        font-size: 0.92rem;
        font-weight: 500;
        text-decoration: none;
      }

      .link-btn:hover {
        transform: none;
        text-decoration: underline;
      }

      .complete-actions {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 12px;
      }

      .complete-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .celebration.show {
        opacity: 1;
        visibility: visible;
      }

      .celebration-inner {
        min-width: 100vw;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 900;
        line-height: 1.05;
        color: white;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
        animation: celebrationFlash 0.9s ease-in-out infinite alternate;
      }

      @keyframes celebrationFlash {
        0% {
          background: linear-gradient(135deg, #5b6ee1, #7c8fe8);
          opacity: 0.96;
        }
        50% {
          background: linear-gradient(135deg, #6bb7c8, #8fd0dc);
          opacity: 0.92;
        }
        100% {
          background: linear-gradient(135deg, #8a7fe0, #a7a1ea);
          opacity: 0.96;
        }
      }

      .empty-state {
        border: 1px dashed var(--border);
        border-radius: 0;
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .status-line {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 820px) {
        .score-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .task-form {
          grid-template-columns: 1fr;
        }

        .complete-actions,
        .task-actions,
        .task-links {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="celebration" class="celebration" aria-live="polite">
        <div class="celebration-inner" id="celebrationText"></div>
      </div>

      <section class="hero">
        <form id="taskForm" class="task-form">
          <input
            id="taskInput"
            type="text"
            placeholder="Add a task, for example: Tidy playroom"
            maxlength="140"
            required
          />
          <button type="submit" class="primary-btn">Add task</button>
        </form>
        <div id="statusLine" class="status-line">Connecting…</div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Scoreboard</h2>
          <button type="button" id="resetScoresBtn" class="secondary-btn">Reset scoreboard</button>
        </div>
        <div class="score-grid">
          <div class="score-card">
            <div class="score-row">
              <div id="womanScore" class="score-value">0</div>
              <div class="score-name">Woman</div>
            </div>
          </div>
          <div class="score-card">
            <div class="score-row">
              <div id="manScore" class="score-value">0</div>
              <div class="score-name">Man</div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Outstanding tasks</h2>
          <div class="count-badge" id="todoCount">0</div>
        </div>
        <div id="todoList" class="task-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Done list</h2>
          <div class="count-badge" id="doneCount">0</div>
        </div>
        <div id="doneList" class="task-list"></div>
      </section>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://vsaqwqmrisyehofezolp.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_B5awAvzLtHLhk-2Lyf_CoQ_Y8R_ZXHo";
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const celebrationMessages = [
        "Well done! 🌟",
        "Congratulations! 🎉",
        "You're a superstar! ⭐",
        "Boom. Another one done! 💥",
        "Amazing work! 🦸",
        "High five! 🙌",
        "That was brilliant! 🥳",
        "You smashed it! 🚀",
        "Victory unlocked! 🏆",
        "Mission accomplished! ✅"
      ];

      const taskForm = document.getElementById("taskForm");
      const taskInput = document.getElementById("taskInput");
      const todoList = document.getElementById("todoList");
      const doneList = document.getElementById("doneList");
      const todoCount = document.getElementById("todoCount");
      const doneCount = document.getElementById("doneCount");
      const womanScore = document.getElementById("womanScore");
      const manScore = document.getElementById("manScore");
      
      const resetScoresBtn = document.getElementById("resetScoresBtn");
      const celebration = document.getElementById("celebration");
      const celebrationText = document.getElementById("celebrationText");
      const statusLine = document.getElementById("statusLine");

      let tasks = [];
      let scoreboardState = {
        woman_score: 0,
        man_score: 0,
        last_reset_at: null
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      

      

      async function ensureScoreboardRow() {
        const { data, error } = await supabase
          .from("scoreboard")
          .select("*")
          .eq("id", 1)
          .maybeSingle();

        if (error) {
          console.error("ensureScoreboardRow error", error);
          statusLine.textContent = `Could not load scoreboard: ${error.message}`;
          return;
        }

        if (!data) {
          const { error: insertError } = await supabase.from("scoreboard").insert({
            id: 1,
            woman_score: 0,
            man_score: 0,
            last_reset_at: new Date().toISOString()
          });

          if (insertError) {
            console.error("scoreboard insert error", insertError);
            statusLine.textContent = `Could not create scoreboard: ${insertError.message}`;
            return;
          }
        }
      }

      async function loadScoreboard() {
        const { data, error } = await supabase
          .from("scoreboard")
          .select("*")
          .eq("id", 1)
          .single();

        if (error) {
          console.error("loadScoreboard error", error);
          statusLine.textContent = `Could not load scoreboard: ${error.message}`;
          return false;
        }

        scoreboardState = data;
        renderScoreboard();
        return true;
      }

      function renderScoreboard() {
        const woman = Number(scoreboardState.woman_score || 0);
        const man = Number(scoreboardState.man_score || 0);
        womanScore.textContent = String(woman);
        manScore.textContent = String(man);
      }

      function renderTasks(target, rows, emptyText, isDone) {
        target.innerHTML = rows.length
          ? rows
              .map(
                (task) => `
              <div class="task-item ${isDone ? "done-item" : ""}" data-id="${task.id}">
                <div class="task-text">
                  <div class="task-main">${escapeHtml(task.title)}</div>
                  ${isDone && task.completed_by ? `<div class="done-by ${task.completed_by}">Completed by: ${escapeHtml(task.completed_by)}</div>` : ""}
                  ${isDone ? `<div class="task-actions"><button type="button" class="undo-btn" data-action="undo">Undo</button><button type="button" class="secondary-btn" data-action="edit">Edit</button><button type="button" class="danger-btn" data-action="delete">Delete</button></div>` : `<div class="complete-actions"><button type="button" class="woman-btn" data-action="complete-woman">Woman</button><button type="button" class="man-btn" data-action="complete-man">Man</button></div><div class="task-links"><button type="button" class="link-btn" data-action="edit">Edit</button><button type="button" class="link-btn" data-action="delete">Delete</button></div>`}
                </div>
              </div>
            `
              )
              .join("")
          : `<div class="empty-state">${emptyText}</div>`;
      }

      function render() {
        const todos = tasks.filter((task) => !task.is_done);
        const done = tasks.filter((task) => task.is_done);

        todoCount.textContent = `${todos.length} task${todos.length === 1 ? "" : "s"}`;
        doneCount.textContent = `${done.length} done`;

        renderTasks(todoList, todos, "No outstanding tasks.", false);
        renderTasks(doneList, done, "Nothing completed yet.", true);
        renderScoreboard();
      }

      async function loadTasks() {
        statusLine.textContent = "Loading tasks…";

        const { data, error } = await supabase
          .from("tasks")
          .select("*")
          .order("is_done", { ascending: true })
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: true });

        if (error) {
          console.error("loadTasks error", error);
          statusLine.textContent = `Could not load tasks: ${error.message}`;
          return false;
        }

        tasks = data ?? [];
        render();
        statusLine.textContent = "Connected.";
        return true;
      }

      async function addTask(title) {
        const sortOrder = tasks.reduce((max, t) => Math.max(max, Number(t.sort_order) || 0), 0) + 1;

        const { error } = await supabase.from("tasks").insert({
          title,
          is_done: false,
          sort_order: sortOrder,
          completed_by: null
        });

        if (error) {
          console.error("addTask error", error);
          alert(`Could not add task: ${error.message}`);
          statusLine.textContent = `Add failed: ${error.message}`;
          return;
        }

        taskInput.value = "";
        taskInput.blur();
        await loadTasks();
      }

      async function updateTask(id, changes) {
        const { error } = await supabase.from("tasks").update(changes).eq("id", id);

        if (error) {
          console.error("updateTask error", error);
          alert(`Could not update task: ${error.message}`);
          statusLine.textContent = `Update failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      async function deleteTask(id) {
        const { error } = await supabase.from("tasks").delete().eq("id", id);

        if (error) {
          console.error("deleteTask error", error);
          alert(`Could not delete task: ${error.message}`);
          statusLine.textContent = `Delete failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      async function incrementScore(kind) {
        const nextWoman = Number(scoreboardState.woman_score || 0) + (kind === "woman" ? 1 : 0);
        const nextMan = Number(scoreboardState.man_score || 0) + (kind === "man" ? 1 : 0);

        const { error } = await supabase
          .from("scoreboard")
          .update({
            woman_score: nextWoman,
            man_score: nextMan
          })
          .eq("id", 1);

        if (error) {
          console.error("incrementScore error", error);
          alert(`Could not update scoreboard: ${error.message}`);
          statusLine.textContent = `Score update failed: ${error.message}`;
          return false;
        }

        scoreboardState.woman_score = nextWoman;
        scoreboardState.man_score = nextMan;
        renderScoreboard();
        return true;
      }

      async function resetScoreboard() {
        const { error } = await supabase
          .from("scoreboard")
          .update({
            woman_score: 0,
            man_score: 0,
            last_reset_at: new Date().toISOString()
          })
          .eq("id", 1);

        if (error) {
          console.error("resetScoreboard error", error);
          alert(`Could not reset scoreboard: ${error.message}`);
          statusLine.textContent = `Reset failed: ${error.message}`;
          return false;
        }

        await loadScoreboard();
        return true;
      }

      function showCelebration(kind) {
        const message = celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
        const label = kind === "woman" ? "Woman +1" : "Man +1";
        celebrationText.innerHTML = `${escapeHtml(message)}<br /><span style="font-size:0.55em; font-weight:800;">${escapeHtml(label)}</span>`;
        celebration.classList.add("show");

        clearTimeout(showCelebration.hideTimer);
        showCelebration.hideTimer = setTimeout(() => {
          celebration.classList.remove("show");
        }, 1800);
      }

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        await addTask(title);
      });

      resetScoresBtn.addEventListener("click", async () => {
        const confirmed = window.confirm("Reset the scoreboard back to zero?");
        if (!confirmed) return;
        await resetScoreboard();
      });

      document.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const action = target.dataset.action;
        if (!action) return;

        const taskElement = target.closest("[data-id]");
        if (!taskElement) return;

        const id = taskElement.getAttribute("data-id");
        const task = tasks.find((item) => item.id === id);
        if (!task) return;

        if (action === "complete-woman" || action === "complete-man") {
          const kind = action === "complete-woman" ? "woman" : "man";
          const okTask = await updateTask(id, { is_done: true, completed_by: kind });
          if (!okTask) return;
          const okScore = await incrementScore(kind);
          if (okScore) showCelebration(kind);
          return;
        }

        if (action === "undo") {
          await updateTask(id, { is_done: false, completed_by: null });
          return;
        }

        if (action === "edit") {
          const title = window.prompt("Edit task:", task.title);
          if (title === null) return;
          const trimmed = title.trim();
          if (!trimmed) return;
          await updateTask(id, { title: trimmed });
          return;
        }

        if (action === "delete") {
          const confirmed = window.confirm(`Delete this task?

${task.title}`);
          if (confirmed) await deleteTask(id);
        }
      });

      supabase
        .channel("tasks-realtime")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "tasks" },
          async () => {
            await loadTasks();
          }
        )
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "scoreboard" },
          async () => {
            await loadScoreboard();
          }
        )
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            statusLine.textContent = "Connected.";
          }
        });

      await ensureScoreboardRow();
      await loadScoreboard();
      await loadTasks();
    </script>
  </body>
</html>
