<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Task Tracker</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-soft: #eef2ff;
        --green-soft: #ecfdf5;
        --border: #e5e7eb;
        --danger: #dc2626;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 220px);
        color: var(--text);
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 18px 60px;
      }

      .hero {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 0;
        box-shadow: var(--shadow);
        padding: 28px;
        margin-bottom: 22px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0;
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 22px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-title {
        margin: 0;
        font-size: 1.35rem;
      }

      .count-badge {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 0;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .task-form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        border: 0;
        border-radius: 0;
        padding: 12px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        min-width: 120px;
      }

      .task-list {
        display: grid;
        gap: 12px;
      }

      .task-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 0;
        padding: 14px;
        background: #fff;
      }

      .done-item {
        background: var(--green-soft);
      }

      .check-btn {
        width: 22px;
        height: 22px;
        border-radius: 0;
        border: 2px solid var(--primary);
        background: white;
        padding: 0;
        min-width: 22px;
      }

      .undo-btn {
        background: #dcfce7;
        color: #166534;
        min-width: 28px;
      }

      .task-text {
        min-width: 0;
      }

      .task-main {
        font-size: 1rem;
        word-break: break-word;
      }

      .task-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .task-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .secondary-btn {
        background: #f3f4f6;
        color: var(--text);
      }

      .danger-btn {
        background: #fee2e2;
        color: var(--danger);
      }

      .celebration {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .celebration.show {
        opacity: 1;
        visibility: visible;
      }

      .celebration-inner {
        min-width: 100vw;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        font-size: clamp(2.2rem, 8vw, 5.5rem);
        font-weight: 900;
        line-height: 1.05;
        color: white;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
        animation: celebrationFlash 0.9s ease-in-out infinite alternate;
      }

      @keyframes celebrationFlash {
        0% {
          background: linear-gradient(135deg, #5b6ee1, #7c8fe8);
          opacity: 0.96;
        }
        50% {
          background: linear-gradient(135deg, #6bb7c8, #8fd0dc);
          opacity: 0.92;
        }
        100% {
          background: linear-gradient(135deg, #8a7fe0, #a7a1ea);
          opacity: 0.96;
        }
      }

      .empty-state {
        border: 1px dashed var(--border);
        border-radius: 0;
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      .status-line {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      @media (max-width: 640px) {
        .task-form {
          grid-template-columns: 1fr;
        }

        .task-item {
          grid-template-columns: auto 1fr;
        }

        .task-actions {
          grid-column: 1 / -1;
          justify-content: flex-start;
          margin-left: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="celebration" class="celebration" aria-live="polite">
        <div class="celebration-inner" id="celebrationText"></div>
      </div>

      <section class="hero">
        <form id="taskForm" class="task-form">
          <input
            id="taskInput"
            type="text"
            placeholder="Add a task, for example: Tidy playroom"
            maxlength="140"
            required
          />
          <button type="submit" class="primary-btn">Add task</button>
        </form>
        <div id="statusLine" class="status-line">Connecting…</div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Outstanding tasks</h2>
          <div class="count-badge" id="todoCount">0</div>
        </div>
        <div id="todoList" class="task-list"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Done list</h2>
          <div class="count-badge" id="doneCount">0</div>
        </div>
        <div id="doneList" class="task-list"></div>
      </section>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://vsaqwqmrisyehofezolp.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_B5awAvzLtHLhk-2Lyf_CoQ_Y8R_ZXHo";

      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const celebrationMessages = [
        "Well done! 🌟",
        "Congratulations, task champion! 🎉",
        "You're a superstar! ⭐",
        "Boom. Another one done! 💥",
        "Amazing work, family hero! 🦸",
        "High five! 🙌",
        "Gold star energy! 🌠",
        "That was brilliant! 🥳",
        "You smashed it! 🚀",
        "Super teamwork! 🤝",
        "Victory unlocked! 🏆",
        "Nice one! Keep going! 😄",
        "Task complete like a legend! 👑",
        "Outstanding effort! 🌈",
        "That deserves a happy dance! 💃",
        "Look at you getting things done! 😎",
        "Top job! 🍀",
        "Mission accomplished! ✅",
        "Household hero mode activated! ⚡",
        "Fantastic work, rock star! 🎸",
        "On it like a scotch bonner!",
        "Work it baby!",
        "Oh yeah!",
        "Levelling up!",
      ];

      const taskForm = document.getElementById("taskForm");
      const taskInput = document.getElementById("taskInput");
      const todoList = document.getElementById("todoList");
      const doneList = document.getElementById("doneList");
      const todoCount = document.getElementById("todoCount");
      const doneCount = document.getElementById("doneCount");
      const celebration = document.getElementById("celebration");
      const celebrationText = document.getElementById("celebrationText");
      const statusLine = document.getElementById("statusLine");

      let tasks = [];

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatUpdatedAt(iso) {
        const date = new Date(iso);
        return `Last updated: ${date.toLocaleString([], {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit"
        })}`;
      }

      function render() {
        const todos = tasks.filter((task) => !task.is_done);
        const done = tasks.filter((task) => task.is_done);

        todoCount.textContent = `${todos.length} task${todos.length === 1 ? "" : "s"}`;
        doneCount.textContent = `${done.length} done`;

        todoList.innerHTML = todos.length
          ? todos
              .map(
                (task) => `
            <div class="task-item" data-id="${task.id}">
              <button type="button" class="check-btn" data-action="complete" title="Mark as done" aria-label="Mark ${escapeHtml(
                task.title
              )} as done"></button>
              <div class="task-text">
                <div class="task-main">${escapeHtml(task.title)}</div>
                <div class="task-meta">${formatUpdatedAt(task.updated_at)}</div>
              </div>
              <div class="task-actions">
                <button type="button" class="secondary-btn" data-action="edit">Edit</button>
                <button type="button" class="danger-btn" data-action="delete">Delete</button>
              </div>
            </div>
          `
              )
              .join("")
          : '<div class="empty-state">No outstanding tasks.</div>';

        doneList.innerHTML = done.length
          ? done
              .map(
                (task) => `
            <div class="task-item done-item" data-id="${task.id}">
              <button type="button" class="undo-btn" data-action="undo" title="Move back to outstanding">↺</button>
              <div class="task-text">
                <div class="task-main">${escapeHtml(task.title)}</div>
                <div class="task-meta">${formatUpdatedAt(task.updated_at)}</div>
              </div>
              <div class="task-actions">
                <button type="button" class="secondary-btn" data-action="edit">Edit</button>
                <button type="button" class="danger-btn" data-action="delete">Delete</button>
              </div>
            </div>
          `
              )
              .join("")
          : '<div class="empty-state">Nothing completed yet.</div>';
      }

      async function loadTasks() {
        statusLine.textContent = "Loading tasks…";

        const { data, error } = await supabase
          .from("tasks")
          .select("*")
          .order("is_done", { ascending: true })
          .order("sort_order", { ascending: true })
          .order("created_at", { ascending: true });

        if (error) {
          console.error("loadTasks error", error);
          statusLine.textContent = `Could not load tasks: ${error.message}`;
          return false;
        }

        tasks = data ?? [];
        render();
        statusLine.textContent = "Connected.";
        return true;
      }

      async function addTask(title) {
        const sortOrder =
          tasks.filter((t) => !t.is_done).reduce((max, t) => Math.max(max, t.sort_order || 0), 0) +
          1;

        const { error } = await supabase.from("tasks").insert({
          title,
          is_done: false,
          sort_order: sortOrder
        });

        if (error) {
          console.error("addTask error", error);
          alert(`Could not add task: ${error.message}`);
          statusLine.textContent = `Add failed: ${error.message}`;
          return;
        }

        taskInput.value = "";
        taskInput.blur();
        await loadTasks();
      }

      async function updateTask(id, changes) {
        const { error } = await supabase.from("tasks").update(changes).eq("id", id);

        if (error) {
          console.error("updateTask error", error);
          alert(`Could not update task: ${error.message}`);
          statusLine.textContent = `Update failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      async function deleteTask(id) {
        const { error } = await supabase.from("tasks").delete().eq("id", id);

        if (error) {
          console.error("deleteTask error", error);
          alert(`Could not delete task: ${error.message}`);
          statusLine.textContent = `Delete failed: ${error.message}`;
          return false;
        }

        await loadTasks();
        return true;
      }

      function showCelebration() {
        const message =
          celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)];
        celebrationText.textContent = message;
        celebration.classList.add("show");

        clearTimeout(showCelebration.hideTimer);
        showCelebration.hideTimer = setTimeout(() => {
          celebration.classList.remove("show");
        }, 1800);
      }

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        await addTask(title);
      });

      document.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const action = target.dataset.action;
        if (!action) return;

        const taskElement = target.closest("[data-id]");
        if (!taskElement) return;

        const id = taskElement.getAttribute("data-id");
        const task = tasks.find((item) => item.id === id);
        if (!task) return;

        if (action === "complete") {
          const ok = await updateTask(id, { is_done: true });
          if (ok) showCelebration();
          return;
        }

        if (action === "undo") {
          await updateTask(id, { is_done: false });
          return;
        }

        if (action === "edit") {
          const edited = window.prompt("Edit task:", task.title);
          if (edited === null) return;
          const trimmed = edited.trim();
          if (!trimmed) return;
          await updateTask(id, { title: trimmed });
          return;
        }

        if (action === "delete") {
          const confirmed = window.confirm(`Delete this task?\n\n${task.title}`);
          if (confirmed) {
            await deleteTask(id);
          }
        }
      });

      supabase
        .channel("tasks-realtime")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "tasks" },
          async () => {
            await loadTasks();
          }
        )
        .subscribe();

      await loadTasks();
    </script>
  </body>
</html>
